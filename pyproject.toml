[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edurecops"
version = "0.2.0"
description = "Learning-outcome-aware, real-time course recommendation platform"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "EduRecOps contributors"}]
keywords = ["recommender-system", "mlops", "education", "fastapi", "kafka", "feature-store"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.16"]

[tool.setuptools.packages.find]
where = ["packages"]

[tool.pytest.ini_options]
pythonpath = ["packages", "apps/recommendation_api"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# Ruff 0.16 expanded defaults from 59 to 413 rules. Keep the classic
# pyflakes/pycodestyle set so CI reports real errors, not a style rewrite.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402"]
